      - {doc: phase_transfer_transmetalation, section: Introduction}
      - {doc: phase_transfer_transmetalation, section: Results and discussion}
      - {doc: suzuki_reaction_encyclopedia, section: Transmetalation}
      - {doc: dialkylbiaryl_phosphine_ligands_review, section: Introduction}
  - query_id: q08
    query: does a boronic acid pinacol ester transmetalate directly or hydrolyze to the boronic acid first
    relevant:
