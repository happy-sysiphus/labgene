# Domain ontology profile for KG linking on the Suzuki flow tasks (Pd-catalysed Suzuki-Miyaura coupling of heteroaryl
# halides with a 2-aminobiphenyl palladacycle precatalyst, DBU, THF/water, continuous flow). Generic domain vocabulary
# only: no answer facts (no optimal catalyst, condition or result).
# verified: true = the id and label were checked against the registry on 2026-09-29:
#   ChEBI, RXNO, REX, MOP via the EBI OLS4 API (https://www.ebi.ac.uk/ols4/api/...), not obsolete;
#   QUDT via https://qudt.org/vocab/{unit,quantitykind}/<id> (HTTP 200 with the expected rdfs:label; unknown ids 404).
# Labels are the registry labels; common names are synonyms. verified: false = no registry id was found (checked in
# ChEBI: 3-bromoquinoline, 3-chloropyridine, the three boron reagents, DBU, PCy3, PtBu3, protodeboronation, flow reactor)
# or an application term of the LabGene schema (lg:).
