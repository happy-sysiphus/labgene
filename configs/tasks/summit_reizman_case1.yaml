# CANDIDATE task - NOT validated. Evidence and open questions:
# docs/implementation/task-validation/summit_reizman_case1.json. Do not register for evaluation until
# registrable_for_evaluation(report, task) is true.
# Targets follow the source paper's reported optimum (yield + TON jointly), NOT the dataset's max yield.
# Tolerances (5 / 3) are candidates, not yet frozen (see the report's open questions).
# VALIDITY DEFECT: the rule is met only where the model's TON disagrees with its own yield / loading (the
# TON definition below); the report lists it as a blocking reason. Needs a user decision before any freeze.
# task_id names the upstream benchmark (file name fixed for this candidate): rename to a neutral id before
# main evaluation. simulator_id / simulator_version are already neutral/opaque.
task_id: summit_reizman_case1
version: "0-candidate"
title: "Suzuki-Miyaura coupling in flow: yield and turnover"
problem: >-
  Choose the palladium precatalyst-ligand combination, residence time, temperature and catalyst loading of a
  Suzuki-Miyaura cross-coupling in a continuous-flow reactor so that BOTH the product yield and the turnover
  number (TON = mol product per mol catalyst) reach their targets.
parameters:
  - kind: categorical
    name: catalyst
    choices: [P1-L1, P2-L1, P1-L2, P1-L3, P1-L4, P1-L5, P1-L6, P1-L7]
    description: "precatalyst scaffold (P1/P2) and ligand (L1-L7) code"
  - {kind: continuous, name: residence_time, unit: s, min: 60, max: 600}
  - {kind: continuous, name: temperature, unit: degC, min: 30, max: 110}
  - {kind: continuous, name: catalyst_loading, unit: "mol%", min: 0.5, max: 2.5}
metrics:
  - {name: yield, unit: "%", direction: maximize}
  - {name: ton, unit: "1", direction: maximize}
success:
  - {metric: yield, direction: maximize, target: 82.0, tolerance: 5.0}
  - {metric: ton, direction: maximize, target: 69.0, tolerance: 3.0}
simulator_id: sim.suzuki_c1
simulator_version: w-11463bb7b29ff056
