id: fs-hu-03
status: reviewed
domain: hypothesis_update
counterexample: true
task_file: configs/qualification/fixed_state/tasks/fs_flow_selectivity.yaml
history:
- kind: observation
  id: a001
  parameters: {temperature: 60.0, residence_time: 20.0, solvent: MeCN}
  results: {conversion: 79.81, selectivity: 90.34}
  note:
    hypotheses: ['H1: at 20 min in MeCN, raising the temperature raises conversion while selectivity stays above its
        target', 'H2: selectivity falls as the temperature rises, so the missing conversion has to come from a longer
        residence time at a lower temperature']
- kind: observation
  id: a002
  parameters: {temperature: 70.0, residence_time: 20.0, solvent: MeCN}
  results: {conversion: 88.46, selectivity: 82.8}
remaining_actions: 48
expect:
  actions: [run_experiment]
  parameter_checks:
  - {check: in_range, param: temperature, max: 70.0, when: {check: one_of, param: solvent, values: [MeCN]}}
  - {check: not_duplicate}
  grounding:
    must_not_support: [H1]
rubric: ['Refutes H1 with obs:a002 (selectivity fell to 82.8, below its target, while conversion rose to 88.46) and
    lowers the temperature instead of heating further.']
author_notes: >-
  Counterexample to 'heat buys conversion for free' (rebuilt for finding crit-1). The refuted H1 prescribes a
  temperature above 70 degC (heat further for the missing conversion); the surviving H2 prescribes a lower
  temperature with a longer residence time. H1 was stated for MeCN, so the check rejects only temperatures above
  70 degC in MeCN (repeating obs:a002 is rejected by not_duplicate); residence time and other solvents are free.
  Success exists below 70 degC in MeCN (e.g. 65 degC, 28 min).
