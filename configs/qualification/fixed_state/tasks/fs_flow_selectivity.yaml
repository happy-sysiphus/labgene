# Fixed-state-only public task (researcher qualification, spec §10.3). DRAFT - needs independent review.
# Never run: fixed-state histories are recorded states whose values come from the evaluator-side reference
# function qualification.FIXED_STATE_REFERENCES[simulator_id] (checked on load). Comments are evaluator-side; the
# loaded fields are model-visible, so they carry no qualification cue (finding view-4). The last problem sentence
# asks for the next experiment (user decision U25): every fixed-state task expects run_experiment.
task_id: flow_selectivity
version: '1'
title: Flow reactor conversion and selectivity under a heat budget
problem: Choose temperature, residence time and solvent of a flow reaction so that BOTH conversion and
  selectivity reach their targets without exceeding the heat-exposure budget. At this point, choose the next experiment and reply with a run_experiment action, not a consultation.
parameters:
- kind: continuous
  name: temperature
  unit: degC
  min: 20
  max: 140
- kind: continuous
  name: residence_time
  unit: min
  min: 1
  max: 30
- kind: categorical
  name: solvent
  choices:
  - MeCN
  - EtOH
  - toluene
constraints:
- coefficients:
    temperature: 1.0
    residence_time: 4.0
  op: <=
  rhs: 180.0
  description: 'heat-exposure budget: temperature + 4*residence_time <= 180'
metrics:
- name: conversion
  unit: '%'
  direction: maximize
- name: selectivity
  unit: '%'
  direction: maximize
success:
- metric: conversion
  direction: maximize
  target: 90.0
  tolerance: 1.0
- metric: selectivity
  direction: maximize
  target: 85.0
  tolerance: 1.0
simulator_id: sim.flow_selectivity
simulator_version: '1'
