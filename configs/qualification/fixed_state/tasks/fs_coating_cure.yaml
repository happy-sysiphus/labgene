# Fixed-state-only public task (researcher qualification, spec §10.3). DRAFT - needs independent review.
# Never run: fixed-state histories are recorded states whose values come from the evaluator-side reference
# function qualification.FIXED_STATE_REFERENCES[simulator_id] (checked on load). Comments are evaluator-side; the
# loaded fields are model-visible, so they carry no qualification cue (finding view-4). The last problem sentence
# asks for the next experiment (user decision U25): every fixed-state task expects run_experiment.
task_id: coating_cure
version: '1'
title: Coating cure temperature and time
problem: Choose the cure temperature and cure time of a coating so that its hardness reaches the target.
  At this point, choose the next experiment and reply with a run_experiment action, not a consultation.
parameters:
- kind: continuous
  name: cure_temperature
  unit: degC
  min: 60
  max: 180
- kind: continuous
  name: cure_time
  unit: min
  min: 5
  max: 120
metrics:
- name: hardness
  unit: HV
  direction: maximize
success:
- metric: hardness
  direction: maximize
  target: 88.0
  tolerance: 1.0
simulator_id: sim.coating_cure
simulator_version: '1'
