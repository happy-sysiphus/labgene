[project]
name = "labgene"
version = "0.1.0"
description = "LabGene experiment harness: baseline LLM vs LabGene product consultation under a 50-action budget"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
labgene = "labgene.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labgene"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/e2e"]
markers = [
  "live: calls a real paid provider API; opt-in via LABGENE_LIVE=1 and an approved live profile",
  "science: runs an external scientific simulator worker environment",
]
addopts = "-p no:cacheprovider"
